<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin"><!-- the page URL carries the private ?log= key: other hosts (map tiles, fonts) get the origin only -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Seven by Seven</title>
<meta name="description" content="A trail map of San Francisco and the Bay Area: walk every neighborhood, log every place.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Seven by Seven">
<meta property="og:title" content="Seven by Seven">

<meta property="og:url" content="https://deepak-or1.github.io/7x7/">
<meta property="og:image" content="https://deepak-or1.github.io/7x7/icons/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Seven by Seven">

<meta name="twitter:image" content="https://deepak-or1.github.io/7x7/icons/og.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Seven by Seven">
<meta name="application-name" content="Seven by Seven">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e3dccb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2733" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="map" aria-label="Map of the Bay Area and the Las Vegas Strip" role="img"></canvas>
    <div class="tip" id="tip"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <h1 class="sr">Seven by Seven</h1>
  <div class="top surface">
    <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input type="search" id="q" placeholder="Find a place" autocomplete="off" aria-label="Find a place" enterkeyhint="search"></div>
  </div>

  <!-- the map chip (the area you are on), filled by js/app.js: beside the search field; top left of the map on the phone. Its menu
       of areas is a sibling, so #areas stays the chip's own footprint (the map's insets and label occluders measure it) -->
  <div class="areas" id="areas"></div>
  <div class="amenu" id="areas-menu" role="group" aria-label="Maps" hidden></div>

  <!-- one capsule of map controls: top right of the map (desktop: left of the logbook). On the phone its first slot is where the search
       field above sits (laid over it by z-index), so search, locate and layers read as one capsule; the search field is a real input there
       so a tap opens the keyboard. Search comes first in the page so Tab reaches it before the controls -->
  <div class="ctl" id="ctl">
    <div class="stack surface">
      <span class="qslot" aria-hidden="true"></span>
      <button type="button" id="locate" title="Where am I?" aria-label="Where am I?"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg></button>
      <button type="button" id="lens-btn" title="Color the map by" aria-label="Color the map by" aria-controls="lenses" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"></path><path d="M3 12l9 5 9-5"></path><path d="M3 16l9 5 9-5"></path></svg></button>
      <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
    </div>
    <div class="lenses surface" id="lenses" role="group" aria-label="Color the map by"></div>
  </div>

  <aside class="sheet surface" id="sheet">
    <div class="grip" id="grip" aria-hidden="true"></div>
    <div class="head" id="head"></div>
    <div class="panel" id="panel"></div>
  </aside>
</div>

<script src="data/geo.js"></script>
<script src="data/info.js"></script>
<script src="data/subareas.js"></script>
<script src="data/landmarks.js"></script>
<script src="js/glyph.js"></script>
<script src="js/geom.js"></script>
<script src="js/map.js"></script>
<script src="js/map3d.js"></script>
<script data-map3d>
// The 3D map (beta) is asked for by ?map=3d in the address (?map=2d refuses it), else by the setting kept with the prefs. Only then
// are three.js (from cdnjs, checked against its hash) and the 3D map's own files loaded, here, before the app starts. Without them
// (offline, blocked) js/map3d.js stays inert and the app makes the flat map.
(function () {
  var want = false;
  try { var m = /[?&]map=(2d|3d)(?:&|$)/.exec(location.search); want = m ? m[1] === '3d' : JSON.parse(localStorage.getItem('sbs-prefs-v3') || '{}').map3d === true; if (sessionStorage.getItem('sbs-map3d-off')) want = false; } catch (e) {}
  window.SBS_MAP3D = want;
  if (want) document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js" integrity="sha512-vnmn/Qqn6aG0POAc9mIGzjq0IybrvxJXYDafNvp9JSnDGxeF3pbkSqLvf+YGd5ku63pT7sa/jxHn7/d0mU8+tA==" crossorigin="anonymous" referrerpolicy="no-referrer"><\/script><script src="js/map3d/land.js"><\/script><script src="js/map3d/models.js"><\/script><script src="js/map3d/icons-sf.js"><\/script><script src="js/map3d/icons-away.js"><\/script><script src="js/map3d/blocks.js"><\/script>');
})();
</script>
<script src="js/sheet.js"></script>
<script src="js/places.js"></script>
<script src="js/link.js"></script>
<script src="js/sync-config.js"></script>
<script src="js/sync.js"></script>
<script src="js/confetti.js"></script>
<script src="js/photos.js"></script>
<script src="js/streetmap.js"></script>
<script src="js/lookback.js"></script>
<script src="js/app.js"></script>
</body>
</html>
