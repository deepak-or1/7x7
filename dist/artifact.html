<style>
/* Seven by Seven — the map is the screen. Chrome is flat, frosted, hairlined: no bubbles.
   Type: Bricolage Grotesque for display, Figtree for everything else. */
:root {
  color-scheme: light;
  --water: #cfd9df;
  --paper: #ffffff;
  --paper-2: #f3f5f7;
  --paper-3: #e9edf0;
  --ink: #15202b;
  --ink-2: #3c4a57;
  --muted: #68788a;
  --line: #e1e7eb;
  --line-2: #c6d0d7;
  --accent: #e85a1f;
  --accent-soft: #fdeee6;
  --accent-ink: #ffffff;
  --want: #2f6fcf;
  --want-soft: #e9f0fb;
  --good: #2e8b57;
  --bad: #c93c2e;
  --land: #eaedea;
  --land-other: #dde3e2;
  --dot: #c9d2d4;
  --coast: #8fa6b6;
  --wlbl: #7f95a5;
  --steel: #6b7076;
  --gg: #e85a1f;
  --grey-fill: #d9dfe0;
  --label: #15202b;
  --label-halo: #eaedea;
  --sub-line: #ffffff;
  --v-fog: #8ea4ba; --v-hills: #c98a66; --v-water: #74a9ab; --v-sun: #d6b25c; --v-buzz: #c5848e; --v-green: #9fb48a;
  --fog1:#e9ece9; --fog2:#cfd5d9; --fog3:#adbac6; --fog4:#8ea4ba; --fog5:#5f7a94;
  --hill1:#e9ece9; --hill2:#e3cfae; --hill3:#d0ab7f; --hill4:#b5825a; --hill5:#8c5b37;
  --k-food: #c98a66; --k-drink: #8c6a9b; --k-coffee: #8a6a4f; --k-view: #5f7a94; --k-shop: #d6b25c; --k-park: #7f9a6b; --k-other: #68788a;
  --glyph-face: #ffffff; --glyph-shade: #cfd5d9; --glyph-roof: #f6f8f9;
  --frost: rgba(255,255,255,.82);
  --shadow: 0 10px 30px -14px rgba(21,32,43,.35), 0 1px 1px rgba(21,32,43,.06);
  --edge: rgba(21,32,43,.08);
  --display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --sans: "Figtree", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --r: 12px; --r-sm: 8px;
  --side: 400px;           /* desktop logbook width */
  --sheet-y: 0px;          /* phone: how far the sheet is pushed down, set by script */
  --sheet-vis: 0px;        /* phone: visible sheet height, set by script */
  --ease: cubic-bezier(.22, 1, .36, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --water: #0b1319; --paper: #151d25; --paper-2: #1d2730; --paper-3: #26313b; --ink: #eaeff3; --ink-2: #c3ccd4; --muted: #8e9ca8; --line: #273139; --line-2: #37434d;
    --accent: #ff7a3d; --accent-soft: #3a2316; --accent-ink: #1a110b; --want: #6ea0e0; --want-soft: #1b2a3f; --good: #6fae7f; --bad: #e0675a;
    --land: #28323c; --land-other: #19222b; --dot: #2b3540; --coast: #43607e; --wlbl: #5c7389; --steel: #a7a39b; --gg: #ff7a3d; --grey-fill: #3a4452;
    --label: #eaeff3; --label-halo: #28323c; --sub-line: #151d25;
    --v-fog: #6f88a6; --v-hills: #b8795a; --v-water: #5d9598; --v-sun: #c2a052; --v-buzz: #b0727d; --v-green: #86a075;
    --fog1:#28323c; --fog2:#334456; --fog3:#45607a; --fog4:#6f88a6; --fog5:#a6bdd3;
    --hill1:#2f2c2a; --hill2:#55432f; --hill3:#80603f; --hill4:#ad8458; --hill5:#d8ad7a;
    --k-food: #c98a66; --k-drink: #a483b4; --k-coffee: #a3826a; --k-view: #7f9ab3; --k-shop: #d6b25c; --k-park: #8fae7b; --k-other: #8e9ca8;
    --glyph-face: #2b3640; --glyph-shade: #1a232c; --glyph-roof: #35414c;
    --frost: rgba(21,29,37,.84);
    --shadow: 0 14px 34px -14px rgba(0,0,0,.8), 0 1px 1px rgba(0,0,0,.4); --edge: rgba(255,255,255,.08);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --water: #0b1319; --paper: #151d25; --paper-2: #1d2730; --paper-3: #26313b; --ink: #eaeff3; --ink-2: #c3ccd4; --muted: #8e9ca8; --line: #273139; --line-2: #37434d;
  --accent: #ff7a3d; --accent-soft: #3a2316; --accent-ink: #1a110b; --want: #6ea0e0; --want-soft: #1b2a3f; --good: #6fae7f; --bad: #e0675a;
  --land: #28323c; --land-other: #19222b; --dot: #2b3540; --coast: #43607e; --wlbl: #5c7389; --steel: #a7a39b; --gg: #ff7a3d; --grey-fill: #3a4452;
  --label: #eaeff3; --label-halo: #28323c; --sub-line: #151d25;
  --v-fog: #6f88a6; --v-hills: #b8795a; --v-water: #5d9598; --v-sun: #c2a052; --v-buzz: #b0727d; --v-green: #86a075;
  --fog1:#28323c; --fog2:#334456; --fog3:#45607a; --fog4:#6f88a6; --fog5:#a6bdd3;
  --hill1:#2f2c2a; --hill2:#55432f; --hill3:#80603f; --hill4:#ad8458; --hill5:#d8ad7a;
  --k-food: #c98a66; --k-drink: #a483b4; --k-coffee: #a3826a; --k-view: #7f9ab3; --k-shop: #d6b25c; --k-park: #8fae7b; --k-other: #8e9ca8;
  --glyph-face: #2b3640; --glyph-shade: #1a232c; --glyph-roof: #35414c;
  --frost: rgba(21,29,37,.84);
  --shadow: 0 14px 34px -14px rgba(0,0,0,.8), 0 1px 1px rgba(0,0,0,.4); --edge: rgba(255,255,255,.08);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--water); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { position: fixed; inset: 0; overflow: hidden; }

/* ---------- the map ---------- */
.stage { position: absolute; inset: 0; background: var(--water); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
.stage.dragging { cursor: grabbing; }
.stage.placing { cursor: crosshair; }
.stage.pointing { cursor: pointer; }
#map { display: block; width: 100%; height: 100%; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); padding: 6px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; transform: translate(-50%, calc(-100% - 14px)); white-space: nowrap; opacity: 0; transition: opacity .12s; z-index: 5; }
.tip small { display: block; font-weight: 400; opacity: .78; font-size: 11.5px; }
.tip.on { opacity: 1; }
.toast { position: absolute; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%) translateY(-8px); background: var(--ink); color: var(--paper); font-weight: 600; padding: 9px 14px; border-radius: 8px; opacity: 0; transition: opacity .25s, transform .25s var(--ease); pointer-events: none; font-size: 13.5px; z-index: 9; max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- surfaces ---------- */
.surface { background: var(--frost); -webkit-backdrop-filter: saturate(1.3) blur(14px); backdrop-filter: saturate(1.3) blur(14px); border: 1px solid var(--edge); border-radius: var(--r); box-shadow: var(--shadow); }

/* ---------- top: brand, search, trail ---------- */
.top { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); width: 372px; max-width: calc(100% - 32px); z-index: 4; display: flex; flex-direction: column; }
.brandrow { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; }
.brand { flex: 1; min-width: 0; }
.brand h1 { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1; margin: 0; letter-spacing: -.02em; font-variation-settings: "opsz" 72; white-space: nowrap; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; line-height: 1.3; }
.search { position: relative; flex: none; }
.search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; pointer-events: none; }
.search input { width: 136px; height: 34px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--paper); padding: 0 10px 0 29px; font-size: 13.5px; color: var(--ink); transition: width .2s var(--ease), border-color .15s; }
.search input:focus { outline: none; border-color: var(--ink); width: 196px; }
.search input::placeholder { color: var(--muted); }
.trail { display: flex; align-items: center; gap: 2px; padding: 8px 10px 8px 8px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 500; color: var(--muted); overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
.trail::-webkit-scrollbar { display: none; }
.trail button { border: 0; background: transparent; padding: 4px 6px; border-radius: 6px; color: var(--muted); font-weight: 500; font-size: 13px; line-height: 1.2; }
.trail button:hover { color: var(--ink); background: var(--paper-2); }
.trail button[aria-current="true"] { color: var(--ink); font-weight: 600; }
.trail .sep { color: var(--line-2); font-size: 12px; padding: 0 1px; }
.trail .back { display: none; }

/* ---------- camera controls ---------- */
.ctl { position: absolute; right: calc(var(--side) + 16px + max(16px, env(safe-area-inset-right, 0px))); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; z-index: 4; overflow: visible; }
.ctl .stack { display: flex; flex-direction: column; overflow: hidden; border-radius: var(--r-sm); }
.ctl button { width: 40px; height: 40px; border: 0; border-top: 1px solid var(--line); background: transparent; display: grid; place-items: center; color: var(--ink); font-weight: 600; font-size: 18px; }
.ctl button:first-child { border-top: 0; }
.ctl button:hover { background: var(--paper-2); }
.ctl button[aria-pressed="true"] { color: var(--accent); }
.ctl button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ctl button.busy { opacity: .5; }
.lenses { position: absolute; right: 48px; bottom: 0; width: 258px; padding: 6px; display: none; }
.lenses.on { display: block; }
.lenses button { width: 100%; height: auto; display: grid; grid-template-columns: 1fr auto; align-items: center; text-align: left; padding: 9px 10px; border: 0; border-radius: 6px; font-size: 13.5px; font-weight: 500; gap: 10px; }
.lenses button b { font-weight: 600; display: block; }
.lenses button small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
.lenses button[aria-pressed="true"] { background: var(--paper-2); color: var(--ink); }
.lenses button[aria-pressed="true"] b::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 7px; vertical-align: 2px; }
.lenses .sw { display: inline-flex; gap: 2px; } .lenses .sw i { width: 9px; height: 9px; display: inline-block; background: var(--c); border-radius: 2px; }
.legend { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 3; display: flex; align-items: center; gap: 14px; padding: 7px 12px; font-size: 12px; font-weight: 500; color: var(--ink-2); pointer-events: none; border-radius: var(--r-sm); }
.legend:empty { display: none; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { width: 9px; height: 9px; display: inline-block; background: var(--c); border-radius: 2px; }
.legend .ramp { gap: 1px; } .legend .ramp i { border-radius: 0; } .legend .ramp i:first-child { border-radius: 2px 0 0 2px; } .legend .ramp i:last-child { border-radius: 0 2px 2px 0; }
.legend .hint { color: var(--muted); font-weight: 400; }

/* ---------- the logbook (desktop: right panel; phone: bottom sheet) ---------- */
.sheet { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: var(--side); z-index: 5; display: flex; flex-direction: column; overflow: hidden; }
.grip { display: none; }
.head { flex: none; display: flex; align-items: flex-start; gap: 8px; padding: 16px 18px 12px 14px; border-bottom: 1px solid var(--line); min-height: 58px; }
.head .up { flex: none; width: 32px; height: 32px; border: 0; background: transparent; border-radius: 6px; display: grid; place-items: center; color: var(--ink); margin: 1px 0 0 -4px; }
.head .up:hover { background: var(--paper-2); }
.head .up svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.head .up[hidden] { display: none; }
.head .ttl { flex: 1; min-width: 0; padding-top: 2px; }
.head .eyebrow { margin: 0; }
.head h2 { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.05; margin: 2px 0 0; letter-spacing: -.02em; font-variation-settings: "opsz" 96; text-wrap: balance; }
.head h2 em { font-style: normal; color: var(--accent); }
.head .tools { flex: none; display: flex; gap: 2px; margin-top: 2px; }
.head .tools button { width: 32px; height: 32px; border: 0; background: transparent; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.head .tools button:hover { background: var(--paper-2); color: var(--ink); }
.head .tools button svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.panel { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px 24px; scrollbar-width: thin; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 7px; margin: 0; }
.eyebrow i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; background: var(--c, var(--accent)); }
.lead { font-size: 15px; line-height: 1.45; color: var(--ink-2); margin: 0 0 14px; }
.panel h3 { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel h3:first-child { margin-top: 4px; }
.panel h3 .n { letter-spacing: 0; text-transform: none; font-weight: 500; font-variant-numeric: tabular-nums; }
.panel h3 .act { letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--accent); border: 0; background: transparent; padding: 0; font-size: 13px; }
.panel h3 .act:hover { text-decoration: underline; }
.panel p { margin: 0 0 10px; }
.panel ul.plain { margin: 0; padding-left: 16px; } .panel ul.plain li { margin: 3px 0; color: var(--ink-2); }
.fact { font-size: 14px; line-height: 1.5; color: var(--ink-2); border-left: 2px solid var(--accent); padding: 2px 0 2px 12px; margin: 0; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.fine { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 28px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }

/* buttons: flat, rectangular, hairlined */
.btn { border: 1px solid var(--line-2); background: var(--paper); color: var(--ink); border-radius: var(--r-sm); height: 36px; padding: 0 14px; font-weight: 600; font-size: 13.5px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { border-color: transparent; background: var(--paper-2); }
.btn.quiet:hover { background: var(--paper-3); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.textlinks { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
.textlinks button, .textlinks a { border: 0; background: transparent; padding: 2px 0; color: var(--ink); font-weight: 500; font-size: 14px; text-decoration: none; border-bottom: 1px solid var(--line-2); line-height: 1.3; }
.textlinks button:hover, .textlinks a:hover { border-bottom-color: var(--ink); }
.textlinks .done { color: var(--accent); border-bottom-color: var(--accent-soft); }
.textlinks .want { color: var(--want); border-bottom-color: var(--want-soft); }
.textlinks button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

/* status: been / want */
.marks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; }
.mark { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: var(--r-sm); padding: 9px 11px; transition: border-color .15s, background .15s; }
.mark .box { width: 20px; height: 20px; flex: none; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--line-2) inset; display: grid; place-items: center; transition: background .15s, box-shadow .15s; }
.mark .box svg { width: 12px; height: 12px; opacity: 0; }
.mark b { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.2; }
.mark small { color: var(--muted); font-size: 11.5px; }
.mark:not([disabled]):hover { border-color: var(--line-2); }
.mark.done.on { border-color: var(--accent); background: var(--accent-soft); } .mark.done.on .box { background: var(--accent); box-shadow: none; }
.mark.want.on { border-color: var(--want); background: var(--want-soft); } .mark.want.on .box { background: var(--want); box-shadow: none; }
.mark.on .box svg { opacity: 1; }
.mark[disabled] { opacity: .55; cursor: default; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 12px 0 0; font-size: 13px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
.dots { display: inline-flex; gap: 2px; vertical-align: middle; } .dots i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; background: var(--line-2); } .dots i.on { background: var(--v-fog); }
.stars { display: inline-flex; gap: 1px; color: var(--accent); font-size: 12px; letter-spacing: 1px; }

/* rows: sections, spots, entries */
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { margin: 0; border-bottom: 1px solid var(--line); }
.rows li:last-child { border-bottom: 0; }
.row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 9px 0; color: inherit; }
.row:hover .nm { color: var(--accent); }
.row .ic { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--line-2)); position: relative; }
.row .ic.sq { border-radius: 2px; }
.row .ic.flag { background: var(--accent); } .row .ic.star { background: var(--want); } .row .ic.none { box-shadow: 0 0 0 1.5px var(--line-2) inset; background: transparent; }
.row .nm { font-weight: 500; font-size: 14.5px; line-height: 1.25; min-width: 0; }
.row .nm small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.row .rt .chev { display: inline-block; width: 7px; height: 7px; border-right: 1.5px solid var(--line-2); border-bottom: 1.5px solid var(--line-2); transform: rotate(-45deg); margin-left: 8px; vertical-align: 1px; }
.cols2 { columns: 2; column-gap: 18px; } .cols2 li { break-inside: avoid; }

  known:['Christopher Playground and its canyon views','Diamond Heights Shopping Center','The upper rim of Glen Canyon'],

'Downtown/Civic Center': { vibe:'buzz', fog:1, hills:1, tags:['historic','nightlife','food','dense','artsy'],

'Haight Ashbury': { vibe:'buzz', fog:3, hills:2, tags:['historic','artsy','nightlife','food','parks'],

  known:['Haight Street vintage shops and Amoeba Music','The Grateful Dead house at 710 Ashbury','Buena Vista Park'],

'Mission': { vibe:'sun', fog:1, hills:1, tags:['sunny','food','nightlife','artsy','historic'],

  known:['Lands End trail and the Sutro Baths ruins','The Cliff House overlooking Seal Rocks','Balboa Street and the Russian bakeries'],
  fact:'Sutro Baths opened in 1896 with seven pools under a glass roof and room for 10,000 people. It burned in 1966. At low tide you can still spot shipwrecks from the Lands End trail.' },
'Outer Sunset': { vibe:'fog', fog:5, hills:1, tags:['foggy','waterfront','quiet','food'],
  line:'A surf town at the edge of the continent.',
  known:['Ocean Beach, three miles of cold surf','Judah Street’s cafés and surf shops','Sunset Dunes, the park that replaced the Great Highway'],
  fact:'The whole neighborhood is built on sand dunes. In 2024 voters closed the Great Highway to cars, and the two-mile stretch reopened in 2025 as Sunset Dunes park.' },
'Pacific Heights': { vibe:'hills', fog:2, hills:5, tags:['hilly','views','historic','quiet'],
  line:'Mansions with Bay views, and stairs to earn them.',
  known:['The Lyon Street steps','Fillmore Street shops','Billionaires’ Row along Broadway'],
  fact:'Alta Plaza and Lafayette parks are both hilltops with sweeping views. The Mrs. Doubtfire house at 2640 Steiner Street still draws a steady trickle of fans.' },
'Parkside': { vibe:'fog', fog:5, hills:1, tags:['foggy','quiet','food','parks'],
  line:'The Sunset’s quieter sibling, with Taraval Street noodles.',
  known:['Taraval Street’s restaurants','Stern Grove’s free summer concerts','Pine Lake Park'],
  fact:'Stern Grove Festival has run free outdoor concerts every summer since 1938, in a eucalyptus-lined hollow that hides the fog for a few hours on a good day.' },
'Potrero Hill': { vibe:'sun', fog:1, hills:4, tags:['sunny','hilly','views','food','artsy'],
  line:'A sunny slope with the other crooked street.',
  known:['Vermont Street’s seven hairpin turns','18th Street cafés','McKinley Square’s downtown view'],
  fact:'Vermont Street between 20th and 22nd is arguably more crooked than Lombard, with tighter turns and far fewer tourists. The hill’s sun makes it one of the city’s best microclimates.' },
'Presidio': { vibe:'water', fog:3, hills:3, tags:['parks','waterfront','historic','views'],
  line:'A 1,500-acre Army post turned national park.',
  known:['The Golden Gate Bridge’s south anchorage','Crissy Field and the Tunnel Tops park','Baker Beach'],
  fact:'This was a military post for 218 years, under Spain, Mexico, and the United States, until the Army left in 1994. Andy Goldsworthy’s Spire and Wood Line are hidden in its forests.' },
'Presidio Heights': { vibe:'green', fog:3, hills:3, tags:['quiet','historic','parks'],
  line:'Quiet, leafy, and very expensive.',
  known:['Sacramento Street’s boutiques','Julius Kahn Playground, inside the Presidio wall','Temple Emanu-El’s great dome'],
  fact:'Temple Emanu-El’s 150-foot dome, finished in 1926, was modeled on the Hagia Sophia and is visible from across the Richmond.' },
'Russian Hill': { vibe:'hills', fog:1, hills:5, tags:['hilly','views','historic','quiet'],

  known:['Lombard Street’s eight hairpin turns','Macondray Lane, the model for Tales of the City’s Barbary Lane','The Hyde Street cable car'],
  fact:'The name comes from a small Russian cemetery found on the hill during the Gold Rush. Filbert Street between Hyde and Leavenworth hits a 31.5 percent grade, tied for the steepest in the city.' },
'Seacliff': { vibe:'water', fog:4, hills:3, tags:['views','waterfront','quiet','foggy'],
  line:'Cliffside mansions above a hidden beach.',
  known:['China Beach','The western end of the Lands End trail','Views of the Golden Gate from almost every street'],
  fact:'China Beach is named for the Chinese fishermen who camped in the cove in the 1800s. It is one of the city’s smallest neighborhoods, and one of the few with actual sea cliffs.' },
'South of Market': { vibe:'buzz', fog:1, hills:1, tags:['tech','nightlife','artsy','dense','waterfront'],
  line:'Warehouses turned startups, plus a ballpark on the water.',
  known:['Oracle Park and splash hits into McCovey Cove','SFMOMA and Yerba Buena Gardens','Folsom Street’s nightlife'],
  fact:'The blocks are huge because an 1847 survey used a bigger grid south of Market Street than north of it. That is why streets still refuse to line up across Market.' },
'Treasure Island/YBI': { vibe:'water', fog:2, hills:2, tags:['waterfront','views','historic'],
  line:'An artificial island built for a world’s fair.',
  known:['Skyline views across the Bay','The 1939 Golden Gate International Exposition site','The Bay Bridge tunnel through Yerba Buena Island'],
  fact:'Treasure Island was built from Bay dredge in 1936 and 1937 and was meant to become the city’s airport. The Yerba Buena tunnel next door is the largest-bore tunnel in the world at 76 feet across.' },
'Twin Peaks': { vibe:'hills', fog:5, hills:5, tags:['foggy','hilly','views','parks'],
  line:'The fog gate, 922 feet up.',
  known:['Christmas Tree Point lookout','Eureka and Noe peaks','Habitat for the endangered Mission blue butterfly'],
  fact:'The peaks split the fog as it pours in from the ocean, which is why the east side of the city is sunny while the west side is grey. The Spanish name was Los Pechos de la Chola.' },
'Visitacion Valley': { vibe:'green', fog:2, hills:3, tags:['quiet','parks'],
  line:'The southeast corner, with McLaren Park at the door.',
  known:['Leland Avenue','McLaren Park, the city’s second-largest','The Visitacion Valley Greenway'],
  fact:'Spanish explorers named the valley in 1777 for the Feast of the Visitation. The old Schlage Lock factory site is slowly becoming a new neighborhood.' },
'West of Twin Peaks': { vibe:'fog', fog:5, hills:4, tags:['foggy','hilly','quiet','views'],
  line:'Storybook suburbs inside the city limits.',
  known:['West Portal village and its Muni tunnel','Forest Hill and St. Francis Wood','Mount Davidson, the city’s highest point'],
  fact:'Mount Davidson tops out at 928 feet, the highest natural point in San Francisco, under a 103-foot concrete cross. The Twin Peaks Tunnel, opened in 1918, is what made these neighborhoods possible.' },
'Alcatraz': { vibe:'water', fog:2, hills:2, tags:['historic','waterfront','views'],
  line:'The Rock: a mile and a half offshore, a world away.',
  known:['The cellhouse, open to visitors since 1973','The 1969–71 occupation by Indians of All Tribes','Night tours when the fog comes in'],
  fact:'Nobody is proven to have escaped. The three men who went out through the ventilation grilles in 1962 on a raft of raincoats were never found, and the Bay’s 50-degree water and ebb tide are the usual explanation.' },
'Western Addition': { vibe:'buzz', fog:2, hills:2, tags:['historic','food','artsy','nightlife'],

  known:['Alamo Square and the Painted Ladies','Japantown’s Peace Pagoda','The Fillmore Auditorium and Hayes Valley'],

'Sausalito': { vibe:'water', fog:3, hills:3, tags:['waterfront','views','food','artsy','historic'],
  line:'Houseboats, hillside villas, and the ferry home.',

  fact:'During World War II the Marinship yard here built 93 Liberty ships and tankers in about three years. The warehouse that houses the Bay Model is a leftover from that yard.' },
'Marin City': { vibe:'green', fog:3, hills:3, tags:['historic','quiet','hilly'],
  line:'Built in a hurry for shipyard workers in 1942.',
  known:['Hillside streets looking over Richardson Bay','Rocky Graham Park','The back way into the Headlands via Tennessee Valley'],
  fact:'Marin City went up in 1942 to house Marinship workers, many of them Black families who came west for wartime jobs. Tupac Shakur lived here as a teenager in the late 1980s.' },
'Mill Valley': { vibe:'green', fog:3, hills:4, tags:['quiet','food','hilly','parks'],
  line:'Redwoods, a plaza, and the start of the Dipsea.',
  known:['The Depot plaza and bookstore','Old Mill Park and its redwoods','The Dipsea Stairs, 688 steps toward Mount Tam'],
  fact:'The Dipsea Race, run from here to Stinson Beach since 1905, is the oldest trail race in America. The town is named for a sawmill built in the 1830s, and its remains still stand in Old Mill Park.' },
'Tam Valley': { vibe:'green', fog:4, hills:4, tags:['quiet','hilly','parks','foggy'],

  known:['Tennessee Valley trail to a hidden beach','Homestead Valley’s dirt lanes and stairways','Shoreline Highway winding toward Muir Woods'],
  fact:'Tennessee Valley is named for the SS Tennessee, a steamship that ran aground in the cove in 1853. All 550 or so passengers made it ashore, and pieces of the engine still surface at low tide.' },
'Strawberry': { vibe:'water', fog:2, hills:2, tags:['quiet','waterfront','views'],
  line:'A peninsula of quiet streets on Richardson Bay.',
  known:['Strawberry Village','Shoreline paths along Richardson Bay','The Richardson Bay Audubon Center next door'],
  fact:'The Richardson Bay sanctuary protects about 900 acres of shallow water that is closed to boats each winter, so tens of thousands of migrating ducks and shorebirds can rest in peace.' },
'Tiburon': { vibe:'water', fog:2, hills:3, tags:['waterfront','views','food','quiet'],
  line:'A railroad town turned ferry town, facing the city.',
  known:['Main Street and Ark Row','The ferry to Angel Island','Old St. Hilary’s chapel on the hill'],
  fact:'Ark Row is a lane of former houseboats. In the late 1800s wealthy San Franciscans summered on “arks” moored in Belvedere Cove, and when the lagoon was filled the arks were hauled ashore and became shops.' },
'Belvedere': { vibe:'hills', fog:2, hills:3, tags:['views','quiet','waterfront'],
  line:'An island of mansions, technically.',
  known:['Belvedere Lagoon','City and Angel Island views from the lanes','The China Cabin, a saloon rescued from an 1860s steamship'],
  fact:'Belvedere really was an island, joined to Tiburon only by a causeway and a sandspit. It is one of the smallest and wealthiest cities in California, with a little over 2,000 residents.' },
'Corte Madera': { vibe:'green', fog:2, hills:3, tags:['food','quiet','parks'],
  line:'Two shopping centers and a marsh.',
  known:['The Village and Town Center malls','Corte Madera Marsh and the Bay Trail','Ring Mountain, home of a flower found nowhere else'],
  fact:'Ring Mountain is the only place on earth where the Tiburon mariposa lily grows. The hill is a slab of serpentine rock from the old ocean floor, which is why the soil is so strange.' },
'Larkspur': { vibe:'water', fog:2, hills:3, tags:['food','historic','waterfront','quiet'],
  line:'Ferry terminal, redwood canyon, a brick downtown.',
  known:['The Larkspur ferry to San Francisco','Magnolia Avenue and the Lark Theater','Baltimore Canyon’s redwoods and Dawn Falls'],
  fact:'San Quentin, California’s oldest prison, opened in 1852 on the point just east of town. The ferry docks next door, so the commute passes right beneath its walls.' },
'Kentfield': { vibe:'green', fog:2, hills:4, tags:['quiet','hilly','parks'],
  line:'Big lots under the mountain, and the college.',
  known:['College of Marin','Phoenix Lake and the trails up Mount Tam','MarinHealth Medical Center'],

'Ross': { vibe:'green', fog:2, hills:3, tags:['quiet','historic','parks'],

'San Anselmo': { vibe:'green', fog:2, hills:3, tags:['food','quiet','historic'],

  known:['San Anselmo Avenue’s antique row','The seminary’s castle-like towers on the hill','Imagination Park, with Yoda and Indiana Jones statues'],

'Fairfax': { vibe:'green', fog:1, hills:3, tags:['food','nightlife','parks','hilly','historic','sunny'],

  known:['The Marin Museum of Bicycling and Mountain Bike Hall of Fame','The Fairfax Festival and Good Earth market','Trails up Pine Mountain and Repack Road'],
  fact:'Repack, the fire road where Gary Fisher, Joe Breeze and friends raced clunker bikes in the late 1970s, is on the hill above town. Riders had to repack their coaster brakes with grease after each run, hence the name.' },
'San Rafael': { vibe:'sun', fog:1, hills:3, tags:['historic','food','sunny','dense'],
  line:'Marin’s oldest town and its county seat.',
  known:['Mission San Rafael Arcángel, founded 1817','Frank Lloyd Wright’s Marin County Civic Center','Fourth Street downtown and the Canal district'],
  fact:'The Civic Center was Frank Lloyd Wright’s last major commission; he died in 1959, before it opened. George Lucas filmed parts of THX 1138 there, and it stood in for the future in Gattaca.' },
'Lucas Valley': { vibe:'sun', fog:1, hills:3, tags:['quiet','sunny','hilly','parks'],
  line:'Eichlers in the valley, Skywalker Ranch up the road.',
  known:['Marinwood’s Eichler neighborhoods','Big Rock Ridge trails','Lucas Valley Road toward Nicasio'],

'Novato': { vibe:'sun', fog:1, hills:3, tags:['sunny','parks','quiet','hilly','historic'],

  known:['Mount Burdell and Olompali State Historic Park','Old Town along Grant Avenue','Hamilton Field, an Army air base turned neighborhood'],
  fact:'Olompali was a Coast Miwok village for centuries and the site of the Bear Flag Revolt’s only skirmish in 1846. In 1966 the Grateful Dead rented the ranch house there for a summer.' },
'San Geronimo Valley': { vibe:'green', fog:2, hills:3, tags:['quiet','parks','hilly'],
  line:'Four small towns under the redwoods, on the way to the coast.',
  known:['Samuel P. Taylor State Park','The old golf course, now open space','Woodacre, Forest Knolls and Lagunitas along Sir Francis Drake'],

'Stinson Beach': { vibe:'water', fog:4, hills:2, tags:['waterfront','foggy','food','parks'],
  line:'Three miles of sand at the end of the Dipsea.',
  known:['The beach itself','Bolinas Lagoon','The Parkside Café and the Sand Dollar'],
  fact:'The beach sits almost on top of the San Andreas Fault, which runs under Bolinas Lagoon. The Bolinas side is on the Pacific Plate and creeps northwest about an inch a year.' },
'Muir Beach': { vibe:'water', fog:4, hills:3, tags:['waterfront','quiet','foggy'],

  known:['The Pelican Inn','Green Gulch Farm Zen Center','The Muir Beach Overlook and its WWII bunkers'],

'Bolinas': { vibe:'fog', fog:4, hills:2, tags:['quiet','waterfront','artsy','foggy'],
  line:'The town that kept tearing down its own road signs.',
  known:['Bolinas Beach and the surf at the Patch','Smiley’s Saloon, open since 1851','The Bolinas Museum'],

'Marin Headlands': { vibe:'water', fog:5, hills:4, tags:['views','parks','waterfront','foggy','historic'],
  line:'The postcard view of the bridge, from the hills.',
  known:['Hawk Hill and the Battery Spencer overlook','Point Bonita Lighthouse','Rodeo Beach and the Marine Mammal Center'],
  fact:'Hawk Hill sees the largest raptor migration on the West Coast each fall, tens of thousands of hawks funneling toward the narrowest crossing of the Golden Gate. The hills are dotted with Cold War Nike missile sites.' },
'Mount Tam & Muir Woods': { vibe:'hills', fog:4, hills:5, tags:['hilly','views','parks','foggy','historic'],
  line:'The sleeping lady, 2,571 feet over everything.',
  known:['East Peak and the old gravity-car grade','Muir Woods’ old-growth redwoods','The Mountain Theater’s stone amphitheater'],
  fact:'From 1896 to 1930 the “Crookedest Railroad in the World” climbed 281 curves from Mill Valley to the summit, and gravity cars coasted back down. Muir Woods was saved in 1908 when William Kent bought the canyon and gave it to the nation.' },
'Angel Island': { vibe:'water', fog:2, hills:3, tags:['parks','views','historic','waterfront'],

  known:['The Immigration Station at China Cove','The five-mile Perimeter Road','Mount Livermore’s 360-degree summit'],

'Oakland': { vibe:'buzz', fog:2, hills:4, tags:['food','nightlife','artsy','historic','parks','dense'],

'Berkeley': { vibe:'buzz', fog:2, hills:4, tags:['food','historic','artsy','parks','hilly'],

'Emeryville': { vibe:'buzz', fog:2, hills:1, tags:['tech','waterfront','dense'],

  known:['Pixar Animation Studios','Bay Street and the Public Market','The marina and the Bay Trail'],
  fact:'Emeryville was built on top of one of the largest Ohlone shellmounds in the Bay Area, a 60-foot hill of shells and artifacts that was leveled in 1924. The Bay Street mall sits where it stood.' },
'Alameda': { vibe:'water', fog:2, hills:1, tags:['waterfront','historic','quiet','food','nightlife'],

  known:['Park Street and Webster Street','Spirits Alley’s distilleries on the old Naval Air Station','Crown Memorial State Beach'],

'Piedmont': { vibe:'hills', fog:2, hills:4, tags:['quiet','views','historic','hilly'],

  known:['Piedmont Park and its Japanese tea house','Dracena Quarry Park','Hillside streets with views to the bridge'],

'Albany': { vibe:'green', fog:2, hills:2, tags:['quiet','food','waterfront','parks'],

  known:['Solano Avenue’s restaurants and the Albany Twin','Albany Hill','The Albany Bulb, a landfill turned art park'],

'El Cerrito': { vibe:'green', fog:2, hills:3, tags:['quiet','food','hilly','historic'],

'Kensington': { vibe:'hills', fog:2, hills:4, tags:['quiet','views','hilly'],

'Richmond': { vibe:'water', fog:2, hills:3, tags:['historic','waterfront','parks','food'],

  known:['Rosie the Riveter WWII Home Front National Historical Park','Point Richmond and Keller Beach','Point Pinole and the Richmond–San Rafael Bridge views'],

'San Leandro': { vibe:'sun', fog:1, hills:2, tags:['food','quiet','historic','waterfront','sunny'],

'Daly City': { vibe:'fog', fog:5, hills:3, tags:['foggy','food','quiet','historic','waterfront'],

'Colma': { vibe:'green', fog:4, hills:2, tags:['historic','quiet'],

'Brisbane': { vibe:'hills', fog:3, hills:4, tags:['quiet','hilly','views','waterfront'],

'South San Francisco': { vibe:'buzz', fog:3, hills:2, tags:['historic','tech','food','dense'],

'San Bruno': { vibe:'fog', fog:4, hills:3, tags:['foggy','hilly','historic','parks'],

'Millbrae': { vibe:'buzz', fog:3, hills:2, tags:['food','dense'],

  // ---------- tracker ----------
  let docRef = null, writing = Promise.resolve(), lastSent = null;
  const clone = o => JSON.parse(JSON.stringify(o || {}));
  function persist() {
    const spots = {}; for (const id in state.spots) { const { _xy, ...rest } = state.spots[id]; spots[id] = rest; }
    const payload = { hoods: state.done, want: state.want, spots, updatedAt: new Date().toISOString() };

  }

      ${placed ? '' : `<div class="actions" style="margin:0 0 14px"><button type="button" class="btn sm" id="lf-pin">${ICON.pin} Drop a pin on the map</button><button type="button" class="btn sm" id="lf-gps">Use my location</button></div>`}
      <div class="field"><label>Kind</label><div class="seg" id="lf-kind">${Object.entries(KINDS).filter(([k]) => k !== 'other').map(([k, v]) => `<button type="button" data-k="${k}" aria-pressed="${d.kind === k}">${v.label}</button>`).join('')}</div></div>
      <div class="field"><label>Status</label><div class="seg" id="lf-status"><button type="button" data-s="been" aria-pressed="${d.status === 'been'}">Been</button><button type="button" data-s="want" aria-pressed="${d.status === 'want'}">Want to try</button></div></div>
      <div class="two" id="lf-been" ${d.status === 'been' ? '' : 'hidden'} style="display:${d.status === 'been' ? 'grid' : 'none'};grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
        <div class="field" style="margin:0"><label>Rating</label><div class="rate" id="lf-rate">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-r="${n}" class="${n <= d.rating ? 'on' : ''}" aria-label="${n} star${n > 1 ? 's' : ''}">★</button>`).join('')}</div></div>
        <div class="field" style="margin:0"><label for="lf-date">When</label><input type="date" id="lf-date" value="${esc(d.at || today())}"></div>
      </div>
      <div class="field"><label for="lf-note">Note</label><textarea id="lf-note" rows="2" placeholder="What to order, who to bring, what to skip">${esc(d.note || '')}</textarea></div>
      <div class="actions"><button type="submit" class="btn primary">${d.id ? 'Save changes' : 'Save spot'}</button><button type="button" class="btn" id="lf-cancel">Cancel</button>${d.id ? '' : (!placed ? `<span style="font-size:12.5px;color:var(--muted);align-self:center">Without a pin it lands in the middle of ${esc(d.sub || d.hood || 'the map')}.</span>` : '')}</div>
    </form>`;
    const form = panel.querySelector('#logform'), qi = panel.querySelector('#lf-q'), sug = panel.querySelector('#lf-sug');
    qi.addEventListener('input', () => { d.name = qi.value; if (placed && d.src === 'search') return; clearTimeout(sugTimer); const v = qi.value.trim(); if (v.length < 2) { sug.hidden = true; return; } sugTimer = setTimeout(() => suggest(v, sug, qi, false), 280); });
    qi.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(sugTimer); const first = sug.querySelector('[data-i]'); if (first && !sug.hidden) first.click(); else if (qi.value.trim().length >= 2 && !(placed && d.src === 'search')) suggest(qi.value.trim(), sug, qi, true); } });
    panel.querySelectorAll('#lf-kind [data-k]').forEach(b => b.addEventListener('click', () => { d.kind = b.dataset.k; panel.querySelectorAll('#lf-kind [data-k]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));
    panel.querySelectorAll('#lf-status [data-s]').forEach(b => b.addEventListener('click', () => { d.status = b.dataset.s; panel.querySelectorAll('#lf-status [data-s]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); panel.querySelector('#lf-been').style.display = d.status === 'been' ? 'grid' : 'none'; }));
    panel.querySelectorAll('#lf-rate [data-r]').forEach(b => b.addEventListener('click', () => { d.rating = d.rating === +b.dataset.r ? 0 : +b.dataset.r; panel.querAll = null; panel.querySelectorAll('#lf-rate [data-r]').forEach(x => x.classList.toggle('on', +x.dataset.r <= d.rating)); }));
    panel.querySelector('#lf-date').addEventListener('change', e => d.at = e.target.value || today());
    panel.querySelector('#lf-note').addEventListener('input', e => d.note = e.target.value);
    panel.querySelector('#lf-cancel').addEventListener('click', cancelLog);
    const clr = panel.querySelector('#lf-clear'); if (clr) clr.addEventListener('click', () => { d.lon = d.lat = d.x = d.y = null; d.where = ''; d.src = null; renderLogForm(); });
    const pin = panel.querySelector('#lf-pin'); if (pin) pin.addEventListener('click', () => { state.placing = true; state.pending = null; stage.classList.add('placing'); if (isPhone()) sheet.set('peek'); toast('Tap the map where it is', 3200); map.redraw(); });
    const gps = panel.querySelector('#lf-gps'); if (gps) gps.addEventListener('click', () => locate(pos => { const [x, y] = Geom.proj(pos); const w = locateXY(x, y); Object.assign(d, { lon: pos[0], lat: pos[1], x, y, hood: w.hood || d.hood, sub: w.sub, src: 'gps', where: 'Your location' }); renderLogForm(); }));
    form.addEventListener('submit', e => { e.preventDefault(); saveDraft(); });
  }
  async function suggest(v, sug, qi, explicit) {
    const my = ++sugCtrl, d = state.draft; let res = [];
    const bias = d.hood ? (() => { const bb = map.hoodBBox(IDX[d.hood]); return Geom.unproj((bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2); })() : null;
    try { res = await window.Places.search(v, bias, { explicit }); } catch (e) { if (e.name === 'AbortError') return; sug.hidden = true; if (!state.searchDown) { state.searchDown = true; const n = panel.querySelector('#lf-nosearch'); if (n) n.hidden = false; } return; }
    if (window.Places.search.photonDown && !state.searchDown) { state.searchDown = true; const n = panel.querySelector('#lf-nosearch'); if (n) n.hidden = false; }
    if (my !== sugCtrl || !state.draft || state.view !== 'log') return;
    if (!res.length) { sug.hidden = true; return; }
    sug.hidden = false; sug.innerHTML = res.map((r, i) => `<li><button type="button" data-i="${i}"><span><b>${esc(r.name)}</b><small>${esc(r.where)}</small></span><span class="k">${esc(r.osm)}</span></button></li>`).join('');
    sug.querySelectorAll('[data-i]').forEach(b => b.addEventListener('click', () => { const r = res[+b.dataset.i], [x, y] = Geom.proj([r.lon, r.lat]), w = locateXY(x, y); Object.assign(d, { name: r.name, lon: r.lon, lat: r.lat, x, y, where: r.where, src: 'search', hood: w.hood || d.hood, sub: w.sub, kind: r.kind || d.kind }); renderLogForm(); }));
  }
  function placePending(xy) {
    const [x, y] = xy, [lon, lat] = Geom.unproj(x, y), w = locateXY(x, y), d = state.draft;
    state.placing = false; stage.classList.remove('placing');
    if (!d) { state.draft = { id: null, name: '', kind: 'food', status: 'been', rating: 0, note: '', at: today(), lon, lat, x, y, hood: w.hood, sub: w.sub, src: 'pin', where: '' }; }
    else Object.assign(d, { lon, lat, x, y, hood: w.hood || d.hood, sub: w.sub, src: 'pin', where: '' });
    state.pending = { x, y };
    go(state.loc, { view: 'log', fly: false, replace: true, sheet: isPhone() ? 'full' : undefined });
  }
  function stopPlacing() { state.placing = false; state.pending = null; stage.classList.remove('placing'); map.redraw(); }
  function cancelLog() { const d = state.draft; state.draft = null; stopPlacing(); if (d && d.id) go({ spot: d.id }, { replace: true, fly: false }); else go(state.loc, { replace: true, fly: false }); }
  async function saveDraft() {
    const d = state.draft; if (!d) return; const name = (d.name || '').trim(); if (!name) { panel.querySelector('#lf-q').focus(); return; }
    if (d.lon == null) { // no pin: the centre of the section, or the neighborhood
      let x, y; if (d.hood && d.sub && subByName(d.hood, d.sub)) [x, y] = subByName(d.hood, d.sub).c; else if (d.hood) { const h = HOODS[IDX[d.hood]]; x = h.cx; y = h.cy; } else { const c = map.cam; x = c.x + c.w / 2; y = c.y + c.w * map.H / map.W / 2; }
      x += (Math.random() - .5) * 0.6; y += (Math.random() - .5) * 0.6; const [lon, lat] = Geom.unproj(x, y); const w = locateXY(x, y); Object.assign(d, { lon, lat, x, y, hood: w.hood || d.hood, sub: w.sub || d.sub, src: 'approx' });
    }
    const id = d.id || ('s' + Date.now().toString(36));
    state.spots[id] = { name: name.slice(0, 80), kind: KINDS[d.kind] ? d.kind : 'other', status: d.status === 'want' ? 'want' : 'been', rating: d.status === 'been' ? (d.rating | 0) : 0, note: (d.note || '').trim().slice(0, 400), lon: +d.lon.toFixed(5), lat: +d.lat.toFixed(5), hood: d.hood, sub: d.sub || null, at: d.at || today(), where: (d.where || '').slice(0, 120), src: d.src || null };
    state.draft = null; state.pending = null; state.placing = false; stage.classList.remove('placing');
    toast(d.id ? 'Saved' : `${name} logged`); setSaveState('Saving…'); const ok = await persist(); go({ spot: id }, { replace: true }); if (ok !== false) setSaveState('Saved');
  }
  async function removeSpot(id) { const sp = state.spots[id]; if (!sp) return; delete state.spots[id]; go({ hood: sp.hood, sub: sp.sub }, { replace: true, fly: false }); map.redraw(); await persist(); toast(`${sp.name} removed`); }

  // ---------- where am I ----------
  function locate(onPos) {
    const btn = $('locate');
    if (!navigator.geolocation) { toast('Location is not available here', 3000); return; }
    btn.classList.add('busy');
    navigator.geolocation.getCurrentPosition(pos => {
      btn.classList.remove('busy'); const lon = pos.coords.longitude, lat = pos.coords.latitude, [LON0, LAT0, LON1, LAT1] = G.bbox;
      if (lon < LON0 || lon > LON1 || lat < LAT0 || lat > LAT1) { toast('You are outside the map', 3000); return; }
      const [x, y] = Geom.proj([lon, lat]); map.setMe([x, y]);
      if (onPos) { onPos([lon, lat]); return; }
      const w = locateXY(x, y);
      if (w.hood) { toast('You are in ' + (w.sub ? w.sub + ', ' + w.hood : w.hood), 3000); go(w.sub ? { hood: w.hood, sub: w.sub } : { hood: w.hood }, { fromMap: true }); }
      else { toast('You are here', 3000); map.flyTo([x - .01, y - .01, x + .01, y + .01], 1, NX * 0.08); }
    }, err => {
      btn.classList.remove('busy'); const framed = window.top !== window.self;
      if (err.code === 1 && framed) toast('Location is blocked inside this frame. Open the app on its own.', 3600); else toast(err.code === 1 ? 'Location permission was refused' : 'Could not get a location', 3000);
    }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
  }
  $('locate').addEventListener('click', () => locate());

  // ---------- suggest & quiz ----------
  function surprise() {
    let pool = HOODS.map((h, i) => i).filter(i => inRegion(i) && (state.filters.size ? matches(i) : true));
    const fresh = pool.filter(i => !isDone(i)); if (fresh.length) pool = fresh;
    pool = pool.filter(i => HOODS[i].name !== state.loc.hood); if (!pool.length) return;
    go({ hood: HOODS[pool[Math.floor(Math.random() * pool.length)]].name });
  }
  function startQuiz() {
    const pool = NAMES.filter(n => inRegion(IDX[n])), rounds = Math.min(10, pool.length);
    const order = pool.slice(); for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    state.quiz = { order: order.slice(0, rounds), rounds, round: 0, score: 0, locked: false, lit: null, region: state.loc.region };
    map.setState({ quiz: true, sel: -1, selSub: -1 }); recolor(true); go({ region: state.loc.region }, { keepQuiz: true, replace: true, sheet: isPhone() ? 'half' : undefined });
  }
  function endQuiz(silent) { state.quiz = null; map.setState({ quiz: false }); recolor(true); if (!silent) go({ region: state.loc.region }, { replace: true }); }
  function renderQuiz(verdict) {
    const qz = state.quiz; if (!qz) return;
    if (qz.round >= qz.rounds) {
      const s = qz.score, rank = s >= 10 ? 'Muni operator' : s >= 8 ? 'Certified local' : s >= 5 ? 'Transplant, two years in' : s >= 2 ? 'Tourist with a good map' : 'Just landed at SFO';
      setHead({ eyebrow: 'Where is it?', title: `${s} out of ${qz.rounds}`, onBack: () => endQuiz(), tools: [] });
      panel.innerHTML = `<div class="quiz"><p class="verdict good">${rank}</p><p class="lead">${s === qz.rounds ? 'Perfect. You could give the fog directions.' : 'Play again to meet the ones you missed.'}</p><div class="actions"><button type="button" class="btn primary" id="again">Play again</button><button type="button" class="btn" id="done">Back to the map</button></div></div>`;
      panel.querySelector('#again').addEventListener('click', startQuiz); panel.querySelector('#done').addEventListener('click', () => endQuiz()); return;
    }
    const target = qz.order[qz.round];
    setHead({ eyebrow: `Where is it? · ${qz.round + 1} of ${qz.rounds}`, title: esc(target), onBack: () => endQuiz(), tools: [] });
    panel.innerHTML = `<div class="quiz"><div class="score">Score ${qz.score}</div><div class="bar"><i style="width:${(qz.round / qz.rounds) * 100}%"></i></div><p class="verdict ${verdict ? verdict.cls : ''}">${verdict ? verdict.text : 'Tap it on the map.'}</p><p style="color:var(--muted);margin:0">Hint: ${esc(INFO[target].line)}</p><div class="actions" style="margin-top:14px">${verdict ? '<button type="button" class="btn primary" id="next">Next</button>' : ''}<button type="button" class="btn quiet" id="quit">Quit</button></div></div>`;
    const nx = panel.querySelector('#next'); if (nx) nx.addEventListener('click', nextRound); panel.querySelector('#quit').addEventListener('click', () => endQuiz());
  }
  function answer(name) {
    const qz = state.quiz; if (!qz || qz.locked) return; const target = qz.order[qz.round]; qz.locked = true; qz.lit = target; recolor(true); map.setState({ sel: IDX[target] });
    if (name === target) { qz.score++; renderQuiz({ cls: 'good', text: 'Yes. That is ' + target + '.' }); } else renderQuiz({ cls: 'bad', text: `No, that is ${name}. ${target} is lit up now.` });
    if (isPhone() && sheet.detent === 'peek') sheet.set('half');
  }
  function nextRound() { const qz = state.quiz; qz.round++; qz.locked = false; qz.lit = null; recolor(true); map.setState({ sel: -1 }); renderQuiz(); }

  // ---------- boot ----------
  window.HPP = []; window.HP.forEach(h => { window.HPP[IDX[h.name]] = h.polys.map(poly => poly.map(ring => ring.map(Geom.proj))); });
  function start(saved) {
    renderLenses(); recolor(false);
    const fromHash = (saved && saved.loc) || parseHash(location.hash);
    loadLocal(); // spots must be known before a #spot-- link can resolve
    state.loc = normalize(fromHash); state.bootLoc = fromHash.spot && !state.loc.spot ? fromHash : null;
    sheet.set(isPhone() ? (level(state.loc) >= 2 ? 'half' : 'peek') : 'full', { instant: true, quiet: true });
    map.setState({ region: state.loc.region, sel: state.loc.hood ? IDX[state.loc.hood] : -1, selSub: state.loc.sub ? subIndex(state.loc.hood, state.loc.sub) : -1 });
    try { if (!state.bootLoc) history.replaceState({ loc: state.loc }, '', location.pathname + location.search + hashOf(state.loc)); } catch (e) {}
    render();
    { // synchronously, so the very first frame is already the fitted view
      const l = state.loc; const v = l.hood ? null : map.fitView(...map.regionBBox(l.region), l.region === 'all' ? 1.03 : 1.06, 0); if (v) { map.jumpTo(v); } else { const bb = map.regionBBox(l.region); map.jumpTo(map.fitView(bb[0], bb[1], bb[2], bb[3], 1.06, 0)); flyToLoc(900); }
    }
    connectStore();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => map.redraw());
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { map.refreshPalette(); recolor(false); });
  window.addEventListener('resize', () => { map.resize(); map.redraw(); }); // resize() also catches a devicePixelRatio change (browser zoom)
  window.__sbs = { map, state, go, sheet }; // for tests and the console
  window.claude?.hot?.snapshot?.(() => ({ loc: state.loc }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();

</script>
