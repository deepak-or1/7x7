<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Seven by Seven · 3D map concept</title>
<!-- A concept prototype, not linked from the app. It reads the app's own data files (../../data) and draws them with three.js;
     nothing here writes anywhere. The type is the app's: the same web-font stylesheet its index.html links. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --sans: "Figtree", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.22, 1, .36, 1);
  --bg: #efe9dc; --ink: #15202b; --ink-2: #3c4a57; --muted: #6b6559; --accent: #e85a1f; --accent-ink: #fff;
  --glass: rgba(248,244,235,.76); --glass-edge: rgba(70,55,30,.10); --glass-hi: rgba(255,255,255,.55);
  --glass-shadow: 0 8px 24px -12px rgba(60,45,20,.28), 0 1px 2px rgba(60,45,20,.06);
  --seg-on: #fffdf8; --seg-on-ink: #15202b; --vig: rgba(46,52,64,.11);
}
body[data-look="clay"] { --bg: #fbe8d3; --ink: #2b2140; --ink-2: #4d4266; --muted: #7a6a72; --accent: #ff5a2a; --glass: rgba(255,247,236,.78); --glass-edge: rgba(120,60,30,.10); --seg-on: #ffffff; --vig: rgba(60,50,90,.10); }
body[data-look="night"] { --bg: #0b1118; --ink: #eaeff3; --ink-2: #c3ccd4; --muted: #8e9ca8; --accent: #ff7a3d; --accent-ink: #1a110b; --glass: rgba(22,30,40,.8); --glass-edge: rgba(255,255,255,.08); --glass-hi: rgba(255,255,255,.06);
  --glass-shadow: 0 10px 28px -12px rgba(0,0,0,.65), 0 1px 2px rgba(0,0,0,.3); --seg-on: #3a4652; --seg-on-ink: #eaeff3; --vig: rgba(0,0,0,.42); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 500 14px/1.35 var(--sans); -webkit-font-smoothing: antialiased; overscroll-behavior: none; transition: background .5s var(--ease); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#gl { touch-action: none; cursor: grab; transition: opacity .28s ease; } #gl.grabbing { cursor: grabbing; } #gl.cut { opacity: 0; }
#labels { pointer-events: none; transition: opacity .28s ease; } #labels.cut { opacity: 0; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(135% 105% at 50% 45%, transparent 56%, var(--vig) 100%); }
.grain { position: fixed; inset: 0; pointer-events: none; opacity: .22; mix-blend-mode: multiply; }
body[data-look="night"] .grain { opacity: .0; } body[data-look="clay"] .grain { opacity: .22; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(20px) saturate(1.25); backdrop-filter: blur(20px) saturate(1.25); box-shadow: inset 0 0 0 1px var(--glass-edge), inset 0 1px 0 var(--glass-hi), var(--glass-shadow); }
.title { position: fixed; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); height: 36px; padding: 0 13px 0 11px; border-radius: 18px; display: flex; align-items: center; gap: 8px; font: 600 14.5px/1 var(--display); letter-spacing: -.01em; }
.title i { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); transform: rotate(45deg); }
.title span { font: 600 10px/1 var(--sans); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding-left: 8px; border-left: 1px solid var(--glass-edge); }
.seg { position: fixed; display: flex; padding: 3px; border-radius: 19px; gap: 2px; }
.seg button { appearance: none; border: 0; background: none; color: var(--muted); font: 600 12.5px/1 var(--sans); height: 30px; padding: 0 13px; border-radius: 15px; cursor: pointer; transition: background .25s var(--ease), color .25s var(--ease); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--seg-on-ink); box-shadow: 0 1px 2px rgba(40,30,10,.14), 0 3px 8px -4px rgba(40,30,10,.25); }
.seg button i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
#looks { left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); }
#areas { right: max(14px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); }
.round { position: fixed; right: max(14px, env(safe-area-inset-right)); top: calc(max(14px, env(safe-area-inset-top)) + 46px); width: 36px; height: 36px; border-radius: 18px; border: 0; padding: 0; color: var(--ink-2); cursor: pointer; display: grid; place-items: center; }
.round svg { width: 20px; height: 20px; transition: transform .12s linear; } .round .n { fill: var(--accent); } .round .s { fill: currentColor; opacity: .35; }
.card { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 48px); width: min(372px, calc(100% - 28px)); transform: translate(-50%, 14px); opacity: 0; pointer-events: none; border-radius: 18px; padding: 13px 15px 14px; transition: transform .42s var(--ease), opacity .28s ease; }
.card.on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.card h2 { margin: 0 28px 3px 0; font: 600 21px/1.12 var(--display); letter-spacing: -.015em; }
.card .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; color: var(--muted); }
.card .sub i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; background: var(--c); }
.card .sub b { color: var(--ink-2); font-weight: 600; }
.card .walked { color: var(--accent); font-weight: 600; }
.card p { margin: 8px 0 0; font-size: 13.5px; color: var(--ink-2); }
.card .x { position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border: 0; border-radius: 14px; background: none; color: var(--muted); cursor: pointer; font: 400 18px/1 var(--sans); }
.hint { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 50px); transform: translateX(-50%); font-size: 11.5px; color: var(--muted); padding: 7px 12px; border-radius: 14px; white-space: nowrap; transition: opacity .6s ease; pointer-events: none; }
.hint.off, .card.on ~ .hint { opacity: 0; }
.loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity .7s ease; z-index: 5; }
.loading.off { opacity: 0; pointer-events: none; }
.loading div { text-align: center; font: 600 22px/1 var(--display); letter-spacing: -.02em; }
.loading small { display: block; margin-top: 10px; font: 500 12px/1 var(--sans); color: var(--muted); letter-spacing: .02em; }
.loading u { display: block; width: 120px; height: 2px; margin: 16px auto 0; border-radius: 2px; background: linear-gradient(90deg, var(--accent) 50%, var(--glass-edge) 50%); background-size: 200% 100%; animation: load 1.1s linear infinite; }
@keyframes load { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@media (max-width: 520px) { .title { font-size: 0; gap: 0; padding: 0 12px 0 13px; } .title span { border: 0; padding-left: 9px; } }
@media (min-width: 880px) { .card { left: 24px; bottom: 24px; transform: translate(0, 14px); } .card.on { transform: none; } .hint { bottom: 62px; } }
@media (prefers-reduced-motion: reduce) { .card, #gl, #labels, .loading { transition: none; } }
</style>
</head>
<body data-look="paper">
<canvas id="gl" aria-label="A three-dimensional map of the Bay Area and the Las Vegas Strip" role="img"></canvas>
<canvas id="labels" aria-hidden="true"></canvas>
<div class="grain" id="grain"></div>
<div class="vignette"></div>

<div class="title glass"><i></i>Seven by Seven<span>3D concept</span></div>
<div class="seg glass" id="areas" role="group" aria-label="Map">
  <button data-area="bay" aria-pressed="true">Bay Area</button><button data-area="vegas" aria-pressed="false">Las Vegas</button>
</div>
<button class="round glass" id="north" aria-label="Face north" title="Face north">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path class="n" d="M12 3l3.6 9H8.4z"/><path class="s" d="M12 21l-3.6-9h7.2z"/></svg>
</button>
<div class="seg glass" id="looks" role="group" aria-label="Look">
  <button data-look="paper" aria-pressed="true"><i style="background:#e9e2d2"></i>Paper</button><button data-look="clay" aria-pressed="false"><i style="background:#f28aa0"></i>Clay</button><button data-look="night" aria-pressed="false"><i style="background:#26313b"></i>Night</button>
</div>
<div class="card glass" id="card" role="status" aria-live="polite"><button class="x" aria-label="Close">×</button><h2></h2><div class="sub"></div><p></p></div>
<div class="hint glass" id="hint"></div>
<div class="loading" id="loading"><div>Seven by Seven<small>building the map</small><u></u></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js" integrity="sha512-vnmn/Qqn6aG0POAc9mIGzjq0IybrvxJXYDafNvp9JSnDGxeF3pbkSqLvf+YGd5ku63pT7sa/jxHn7/d0mU8+tA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>if (!window.THREE) document.querySelector('#loading small').textContent = 'three.js did not load from cdnjs (offline?). Reload to try again.';</script>
<script src="../../data/geo.js"></script>
<script src="../../data/info.js"></script>
<script src="../../data/landmarks.js"></script>
<script src="../../js/geom.js"></script>
<script src="m3d-terrain.js"></script>
<script src="m3d-plateau.js"></script>
<script src="m3d-models.js"></script>
<script src="m3d-app.js"></script>
</body>
</html>
