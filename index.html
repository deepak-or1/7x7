<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Seven by Seven</title>
<meta name="description" content="A trail map of San Francisco and the Bay Area: walk every neighborhood, log every place.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-title" content="Seven by Seven">
<meta name="application-name" content="Seven by Seven">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#cfd9df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1319" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage">
    <canvas id="map" aria-label="Map of San Francisco, Marin, the East Bay and the Peninsula" role="img"></canvas>
    <div class="tip" id="tip"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="top surface">
    <div class="brandrow">
      <div class="brand"><h1>Seven by Seven<span>.</span></h1><p>Ninety places between the ocean and the hills.</p></div>
      <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input type="search" id="q" placeholder="Find a place" autocomplete="off" aria-label="Find a place" enterkeyhint="search"></div>
    </div>
    <nav class="trail" id="trail" aria-label="Where you are"></nav>
  </div>

  <div class="legend surface" id="legend"></div>

  <div class="ctl" id="ctl">
    <div class="stack surface">
      <button type="button" id="locate" title="Where am I?" aria-label="Where am I?"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg></button>
      <button type="button" id="lens-btn" title="Color the map by" aria-label="Color the map by" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"></path><path d="M3 12l9 5 9-5"></path><path d="M3 16l9 5 9-5"></path></svg></button>
      <button type="button" id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
      <button type="button" id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
      <button type="button" id="home" title="Whole area" aria-label="Whole area"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
    </div>
    <div class="lenses surface" id="lenses" role="menu" aria-label="Color the map by"></div>
  </div>

  <aside class="sheet surface" id="sheet">
    <div class="grip" id="grip" aria-hidden="true"></div>
    <div class="head" id="head"></div>
    <div class="panel" id="panel"></div>
  </aside>
</div>

<script src="data/geo.js"></script>
<script src="data/info.js"></script>
<script src="data/subareas.js"></script>
<script src="data/landmarks.js"></script>
<script src="js/glyph.js"></script>
<script src="js/geom.js"></script>
<script src="js/map.js"></script>
<script src="js/sheet.js"></script>
<script src="js/places.js"></script>
<script src="js/app.js"></script>
</body>
</html>
